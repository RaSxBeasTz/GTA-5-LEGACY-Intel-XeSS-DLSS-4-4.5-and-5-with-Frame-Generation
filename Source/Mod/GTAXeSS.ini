; GTAXeSS B234 settings
[XeSS]
OutputResolution=1440P
Quality=AUTO

[Intel ARC]
; 1 requires GTA to render on an Intel Arc adapter. Restart GTA after changing.
Enabled=1

[Diagnostics]
; Buffered artifact logs and actual XeFG status. Restart GTA after changes.
Enabled=1

[Pacing]
; R601 uncapped source, explicit shared-colour ownership and isolated preparation queue.
; Restart GTA after changes.
SourceFPS=0

[Redesign]
DirectSharedColor=1
SingleQueue=0
LatestCompleted=1

[NativeMotion]
; Optional raw candidate capture only. Unvalidated vectors remain disabled.
Capture=0

[Graphics]
; Intel or NVIDIA. Restart GTA after changing.
Provider=Intel

[NVIDIA]
; x2 on RTX 40; x2/x4/x6 on supported RTX 50 drivers.
Multiplier=2
; DLSS anti-aliasing at native resolution while FG is active.
DLAA=0

[Upscaling]
; NATIVE, AA, QUALITY, BALANCED, PERFORMANCE, ULTRA_PERFORMANCE.
; Intel also supports ULTRA_QUALITY and ULTRA_QUALITY_PLUS.
; The app obtains actual render dimensions from the SDK before launch.
Quality=NATIVE
InputWidth=0
InputHeight=0

[VisualEnhancement]
; Optional R645 stream-style filmic presentation pass. The app changes this live.
Enabled=0

[App]
AutoStart=1
